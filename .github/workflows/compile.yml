name: Compile Cloud
on: [push]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
    - name: checkout sources
      uses: actions/checkout@v7

    - uses: actions/setup-java@v5
      with:
          java-version: '25'
          distribution: 'temurin'

    - name: Compile
      run:  mvn -B -s settings.xml clean package
